syntax = "proto3";

package garage.auth;

option java_multiple_files = true;
option java_package = "io.garage.auth.grpc";
option go_package = "github.com/gnuvinicius/idp/cli/proto/auth";

service UserService {
  rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);

  rpc Login (LoginRequest) returns (LoginResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  int64 expires_at = 2;
}

message CreateUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string role = 4; // ADMIN, DEVELOPER
}

message CreateUserResponse {
  int64 id = 1;
  string username = 2;
  string email = 3;
  string role = 4;
  string created_at = 5;
}