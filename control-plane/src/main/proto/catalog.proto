syntax = "proto3";

package garage.catalog;

option java_multiple_files = true;
option java_package = "io.garage.catalog.grpc";
option java_outer_classname = "CatalogProto";
option go_package = "github.com/gnuvinicius/idp/cli/proto/catalog";

service TemplateService {
  rpc ListTemplate (ListTemplatesRequest) returns (ListTemplatesResponse);
  rpc DeleteTemplate (DeleteTemplateRequest) returns (DeleteTemplateResponse);
}

service ProjectService {
  rpc GetProject (GetProjectRequest) returns (ProjectResponse);
  rpc ListProjects (ListProjectsRequest) returns (ListProjectsResponse);
  rpc DeleteProject (DeleteProjectRequest) returns (DeleteProjectResponse);
}

// ============================================================================
// TEMPLATE MESSAGES (Golden Paths)
// ============================================================================

message ListTemplatesRequest {
  string stack = 1; // Filtro opcional por stack
}

message ListTemplatesResponse {
  repeated TemplateResponse templates = 1;
}

message DeleteTemplateRequest {
  string id = 1;
}

message DeleteTemplateResponse {
  bool deleted = 1;
}

message TemplateResponse {
  string id = 1;
  string name = 2;
  string description = 3;
  string repository_url = 4;
  string stack = 5;
  string default_parameters_json = 6;
  string created_at = 7;
  string updated_at = 8;
}

// ============================================================================
// PROJECT MESSAGES (Catálogo de Software)
// ============================================================================

enum ProjectStatus {
  PROJECT_STATUS_UNSPECIFIED = 0;
  ACTIVE = 1;
  ARCHIVED = 2;
  PROVISIONING_FAILED = 3;
}

message GetProjectRequest {
  string id = 1;
}

message ListProjectsRequest {
  string owner_id = 1;    // Filtro opcional por dono do serviço
  string template_id = 2; // Filtro opcional por template utilizado
}

message ListProjectsResponse {
  repeated ProjectResponse projects = 1;
}

message DeleteProjectRequest {
  string id = 1;
  bool delete_remote_repository = 2; // Define se também apaga o repo no GitHub
}

message DeleteProjectResponse {
  bool deleted = 1;
}

message ProjectResponse {
  string id = 1;
  string name = 2;
  string description = 3;
  string repository_url = 4;
  string owner_id = 5;
  string owner_email = 6;
  string template_id = 7;
  ProjectStatus status = 8;
  string created_at = 9;
  string updated_at = 10;
}