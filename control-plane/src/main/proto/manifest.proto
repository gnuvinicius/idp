syntax = "proto3";

package garage.manifest;

option java_multiple_files = true;
option java_outer_classname = "ManifestProto";
option java_package = "io.garage.manifest.grpc";
option go_package = "github.com/gnuvinicius/idp/cli/proto/manifest";

service ManifestService {
  rpc ApplyManifest (ManifestRequest) returns (ApplyManifestResponse);
  rpc ValidateManifest (ManifestRequest) returns (ValidateManifestResponse);
}

message ApplyResultResponse {
  string type = 1;
  string name = 2;
  string status = 3;
  string message = 4;
}

message ManifestRequest {
  bytes yaml_content = 1;
}

message ApplyManifestResponse {
  repeated ApplyResultResponse results = 1;
}

message ValidateManifestResponse {
  string status = 1;
}